<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tire Log">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <title>HPDE Tire Logger</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #21262d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --blue: #58a6ff;
      --purple: #a371f7;
      --green: #3fb950;
      --red: #f85149;
      --orange: #e3b341;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      overscroll-behavior: none;
    }
    .view { display: none; flex-direction: column; min-height: 100vh; }
    .view.active { display: flex; }

    /* HEADER */
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 17px; font-weight: 600; color: var(--text); flex: 1; }
    .header .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .back-btn {
      background: none; border: none; color: var(--blue);
      font-size: 16px; font-weight: 500; cursor: pointer;
      padding: 4px 0; display: flex; align-items: center; gap: 4px;
    }

    /* CONTENT */
    .content {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px;
    }

    /* BUTTONS */
    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 13px 20px; border-radius: 10px; border: none;
      font-size: 16px; font-weight: 600; cursor: pointer; min-height: 48px;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: var(--blue); color: #0d1117; width: 100%; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); width: 100%; }
    .btn-sm { font-size: 13px; padding: 7px 12px; min-height: 34px; border-radius: 8px; width: auto; }

    /* FORM */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.3px; }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 13px; font-size: 16px; color: var(--text);
      appearance: none; -webkit-appearance: none; outline: none; min-height: 46px;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--blue); }
    textarea { resize: none; min-height: 70px; font-family: inherit; font-size: 15px; }

    /* HOME */
    .hero { text-align: center; padding: 24px 0 20px; }
    .hero-icon { font-size: 48px; margin-bottom: 10px; }
    .hero h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .hero p { font-size: 13px; color: var(--text-muted); }
    .section-header { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 18px 0 8px; }
    .session-item {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 13px 14px; margin-bottom: 8px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; transition: border-color 0.15s;
    }
    .session-item:active { border-color: var(--blue); }
    .session-item .si-main { flex: 1; min-width: 0; }
    .session-item .si-title { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-item .si-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .session-item .si-badge { background: var(--border); color: var(--text-muted); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
    .chevron { color: var(--text-dim); font-size: 14px; }
    .empty-state { text-align: center; padding: 28px 20px; color: var(--text-dim); font-size: 14px; }
    .empty-state .es-icon { font-size: 32px; margin-bottom: 8px; }

    /* ===== READINGS TABLE ===== */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      max-height: 340px;
      overflow-y: auto;
    }
    table {
      border-collapse: collapse;
      min-width: 100%;
      font-size: 12px;
    }
    thead th {
      background: var(--card);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    thead tr:first-child th {
      border-bottom: none;
      padding-bottom: 3px;
    }
    thead tr:last-child th {
      border-top: none;
      padding-top: 3px;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    tbody td {
      padding: 9px 10px;
      white-space: nowrap;
      color: var(--text);
      vertical-align: middle;
    }
    td.td-time { color: var(--text-muted); font-size: 11px; min-width: 90px; }
    td.td-session { color: var(--text-muted); font-size: 11px; min-width: 80px; }
    td.td-psi { text-align: center; font-weight: 600; font-size: 13px; min-width: 48px; }
    td.td-psi.cold { color: var(--blue); }
    td.td-psi.hot  { color: var(--orange); }
    td.td-psi.empty { color: var(--text-dim); font-weight: 400; }
    td.td-notes { color: var(--text-muted); font-size: 11px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
    td.td-del { padding: 4px 8px; }
    .del-btn { background: none; border: none; color: var(--red); font-size: 16px; cursor: pointer; padding: 4px; }
    .th-wheel { background: rgba(88,166,255,0.08) !important; }

    /* ===== LOG INPUT FORM ===== */
    .log-form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .log-form-title {
      font-size: 13px; font-weight: 700; color: var(--text);
      margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }

    /* 2x2 Tire Grid Inputs */
    .input-tire-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .input-tire-cell {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }
    .input-tire-cell .itc-label {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px;
    }
    .input-tire-cell input[type="number"] {
      padding: 8px 10px; font-size: 18px; font-weight: 600;
      min-height: 42px; margin-bottom: 6px;
    }
    .input-tire-cell .tgt-row {
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    }
    .input-tire-cell .tgt-row label { margin: 0; font-size: 10px; white-space: nowrap; }
    .input-tire-cell .tgt-row input { font-size: 13px; min-height: 34px; padding: 6px 8px; }

    /* Hot/Cold toggle — compact */
    .hc-toggle {
      display: flex; background: var(--border); border-radius: 6px; overflow: hidden;
    }
    .hc-btn {
      flex: 1; padding: 6px 4px; border: none; background: transparent;
      font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s;
      color: var(--text-muted);
    }
    .hc-btn.cold.active { background: var(--blue); color: #0d1117; }
    .hc-btn.hot.active  { background: var(--orange); color: #0d1117; }

    /* Shared row */
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 40px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--green); color: #0d1117;
      padding: 11px 22px; border-radius: 24px; font-size: 14px; font-weight: 600;
      opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 100; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .divider { height: 1px; background: var(--border); margin: 14px 0; }
    .bottom-pad { height: env(safe-area-inset-bottom, 20px); }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .section-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px; }
  </style>
</head>
<body>

<!-- ==================== HOME VIEW ==================== -->
<div id="view-home" class="view active">
  <div class="header">
    <div style="flex:1">
      <h1>🏁 HPDE Tire Logger</h1>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="App.exportCSV()">Export CSV</button>
  </div>
  <div class="content">
    <div class="hero">
      <div class="hero-icon">🏎️</div>
      <h2>Track Day Logger</h2>
      <p>Log tire pressures for every session</p>
    </div>
    <button class="btn btn-primary" onclick="App.newSession()">+ New Session</button>
    <div class="section-header">Recent Sessions</div>
    <div id="home-sessions-list">
      <div class="empty-state"><div class="es-icon">📋</div>No sessions yet</div>
    </div>
    <div class="bottom-pad"></div>
  </div>
</div>

<!-- ==================== NEW SESSION VIEW ==================== -->
<div id="view-new-session" class="view">
  <div class="header">
    <button class="back-btn" onclick="App.goHome()">‹ Back</button>
    <h1>New Session</h1>
  </div>
  <div class="content">
    <div class="form-group">
      <label>Event Name</label>
      <input type="text" id="ns-event" placeholder="e.g. NCM Motorsports Apr 2026">
    </div>
    <div class="form-group">
      <label>Track Name</label>
      <input type="text" id="ns-track" placeholder="e.g. NCM Motorsports Park">
    </div>
    <div class="row">
      <div class="form-group">
        <label>Session Type</label>
        <select id="ns-type">
          <option>Practice</option>
          <option>Hot Lap</option>
          <option>Qualifying</option>
          <option>Race</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Session #</label>
        <input type="number" id="ns-num" value="1" min="1">
      </div>
    </div>
    <div class="form-group">
      <label>Car / Setup Notes (optional)</label>
      <textarea id="ns-notes" placeholder="e.g. Stock setup, 72°F ambient"></textarea>
    </div>
    <button class="btn btn-primary" onclick="App.createSession()">Start Session →</button>
    <div class="bottom-pad"></div>
  </div>
</div>

<!-- ==================== SESSION VIEW ==================== -->
<div id="view-session" class="view">
  <div class="header">
    <button class="back-btn" onclick="App.goHome()">‹ Back</button>
    <div style="flex:1">
      <h1 id="sess-title">Session</h1>
      <div class="subtitle" id="sess-subtitle"></div>
    </div>
  </div>
  <div class="content">

    <!-- READINGS TABLE -->
    <div class="flex-between" style="margin-bottom:8px">
      <div class="section-label">Recent Readings</div>
      <span id="sess-entry-count" style="font-size:11px;color:var(--text-muted)"></span>
    </div>

    <div class="table-wrap" id="readings-table-wrap">
      <table id="readings-table">
        <thead>
          <tr>
            <th rowspan="2">Time</th>
            <th rowspan="2">Session</th>
            <th colspan="2" class="th-wheel">FL</th>
            <th colspan="2" class="th-wheel">FR</th>
            <th colspan="2" class="th-wheel">RL</th>
            <th colspan="2" class="th-wheel">RR</th>
            <th rowspan="2">Notes</th>
            <th rowspan="2"></th>
          </tr>
          <tr>
            <th class="th-wheel">❄️</th><th class="th-wheel">🔥</th>
            <th class="th-wheel">❄️</th><th class="th-wheel">🔥</th>
            <th class="th-wheel">❄️</th><th class="th-wheel">🔥</th>
            <th class="th-wheel">❄️</th><th class="th-wheel">🔥</th>
          </tr>
        </thead>
        <tbody id="readings-tbody">
          <tr><td colspan="12" style="text-align:center;padding:20px;color:var(--text-dim)">No readings yet</td></tr>
        </tbody>
      </table>
    </div>

    <!-- LOG FORM -->
    <div class="log-form-card">
      <div class="log-form-title">📝 Log Reading</div>

      <!-- 2x2 Tire Inputs -->
      <div class="input-tire-grid">
        <!-- FL -->
        <div class="input-tire-cell">
          <div class="itc-label">⬅ Front Left</div>
          <input type="number" id="psi-FL" step="0.5" min="0" max="60" placeholder="PSI">
          <div class="tgt-row">
            <label>Target:</label>
            <input type="number" id="tgt-FL" step="0.5" min="0" max="60" placeholder="—">
          </div>
          <div class="hc-toggle">
            <button class="hc-btn cold active" id="hc-FL-cold" onclick="App.setHC('FL','cold')">❄️ Cold</button>
            <button class="hc-btn hot" id="hc-FL-hot" onclick="App.setHC('FL','hot')">🔥 Hot</button>
          </div>
        </div>
        <!-- FR -->
        <div class="input-tire-cell">
          <div class="itc-label">Front Right ➡</div>
          <input type="number" id="psi-FR" step="0.5" min="0" max="60" placeholder="PSI">
          <div class="tgt-row">
            <label>Target:</label>
            <input type="number" id="tgt-FR" step="0.5" min="0" max="60" placeholder="—">
          </div>
          <div class="hc-toggle">
            <button class="hc-btn cold active" id="hc-FR-cold" onclick="App.setHC('FR','cold')">❄️ Cold</button>
            <button class="hc-btn hot" id="hc-FR-hot" onclick="App.setHC('FR','hot')">🔥 Hot</button>
          </div>
        </div>
        <!-- RL -->
        <div class="input-tire-cell">
          <div class="itc-label">⬅ Rear Left</div>
          <input type="number" id="psi-RL" step="0.5" min="0" max="60" placeholder="PSI">
          <div class="tgt-row">
            <label>Target:</label>
            <input type="number" id="tgt-RL" step="0.5" min="0" max="60" placeholder="—">
          </div>
          <div class="hc-toggle">
            <button class="hc-btn cold active" id="hc-RL-cold" onclick="App.setHC('RL','cold')">❄️ Cold</button>
            <button class="hc-btn hot" id="hc-RL-hot" onclick="App.setHC('RL','hot')">🔥 Hot</button>
          </div>
        </div>
        <!-- RR -->
        <div class="input-tire-cell">
          <div class="itc-label">Rear Right ➡</div>
          <input type="number" id="psi-RR" step="0.5" min="0" max="60" placeholder="PSI">
          <div class="tgt-row">
            <label>Target:</label>
            <input type="number" id="tgt-RR" step="0.5" min="0" max="60" placeholder="—">
          </div>
          <div class="hc-toggle">
            <button class="hc-btn cold active" id="hc-RR-cold" onclick="App.setHC('RR','cold')">❄️ Cold</button>
            <button class="hc-btn hot" id="hc-RR-hot" onclick="App.setHC('RR','hot')">🔥 Hot</button>
          </div>
        </div>
      </div>

      <!-- Shared fields -->
      <div class="row">
        <div class="form-group" style="flex:2">
          <label>Notes</label>
          <input type="text" id="reading-notes" placeholder="e.g. after session 2, slight push">
        </div>
        <div class="form-group" style="flex:1">
          <label>Temp °F</label>
          <input type="number" id="ambient-temp" placeholder="72">
        </div>
      </div>

      <button class="btn btn-primary" onclick="App.logReading()">💾 Log Reading</button>
    </div>

    <div class="divider"></div>
    <button class="btn btn-secondary" style="border-color:var(--red);color:var(--red)" onclick="App.deleteSession()">
      🗑️ Delete Session
    </button>
    <div class="bottom-pad"></div>
  </div>
</div>

<!-- ==================== TOAST ==================== -->
<div class="toast" id="toast"></div>

<script>
// =====================================================
// DATA MODEL
// Storage keys: hpde_sessions, hpde_batches
// Session: { id, event, track, type, num, notes, createdAt }
// Batch: { id, sessionId, timestamp, ambientTemp, note,
//           FL:{psi,target,state}, FR:{...}, RL:{...}, RR:{...} }
// =====================================================
const DB = {
  getSessions() { return JSON.parse(localStorage.getItem('hpde_sessions') || '[]'); },
  saveSessions(d) { localStorage.setItem('hpde_sessions', JSON.stringify(d)); },
  getBatches() { return JSON.parse(localStorage.getItem('hpde_batches') || '[]'); },
  saveBatches(d) { localStorage.setItem('hpde_batches', JSON.stringify(d)); },
  addSession(s) { const d = this.getSessions(); d.unshift(s); this.saveSessions(d); },
  addBatch(b) { const d = this.getBatches(); d.push(b); this.saveBatches(d); },
  deleteBatch(id) { this.saveBatches(this.getBatches().filter(b => b.id !== id)); },
  deleteSession(id) {
    this.saveSessions(this.getSessions().filter(s => s.id !== id));
    this.saveBatches(this.getBatches().filter(b => b.sessionId !== id));
  },
  getSessionBatches(sessionId) {
    return this.getBatches().filter(b => b.sessionId === sessionId);
  },
  // Migrate old entry-based data
  migrate() {
    const old = localStorage.getItem('hpde_entries');
    if (!old) return;
    const entries = JSON.parse(old);
    // Group by timestamp (within 5s = same batch)
    const groups = {};
    entries.forEach(e => {
      const key = e.sessionId + '_' + Math.floor(new Date(e.timestamp).getTime() / 5000);
      if (!groups[key]) groups[key] = { sessionId: e.sessionId, timestamp: e.timestamp, entries: [] };
      groups[key].entries.push(e);
    });
    const batches = this.getBatches();
    Object.values(groups).forEach(g => {
      const b = { id: 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2), sessionId: g.sessionId, timestamp: g.timestamp, note: '', ambientTemp: null };
      ['FL','FR','RL','RR'].forEach(w => {
        const e = g.entries.find(x => x.wheel === w);
        b[w] = e ? { psi: e.psi, target: e.target, state: e.state } : null;
      });
      batches.push(b);
    });
    this.saveBatches(batches);
    localStorage.removeItem('hpde_entries');
  }
};

// Run migration on load
DB.migrate();

// =====================================================
const App = {
  currentSessionId: null,
  hcState: { FL:'cold', FR:'cold', RL:'cold', RR:'cold' },

  showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0,0);
  },

  goHome() {
    this.currentSessionId = null;
    this.renderHome();
    this.showView('view-home');
  },

  renderHome() {
    const sessions = DB.getSessions();
    const el = document.getElementById('home-sessions-list');
    if (!sessions.length) {
      el.innerHTML = '<div class="empty-state"><div class="es-icon">📋</div>No sessions yet.<br>Tap "+ New Session" to get started.</div>';
      return;
    }
    const batches = DB.getBatches();
    el.innerHTML = sessions.map(s => {
      const count = batches.filter(b => b.sessionId === s.id).length;
      const date = new Date(s.createdAt).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
      return `<div class="session-item" onclick="App.openSession('${s.id}')">
        <div class="si-main">
          <div class="si-title">${esc(s.event || s.track || 'Session')}</div>
          <div class="si-sub">${esc(s.track)} · ${esc(s.type)} #${s.num} · ${date}</div>
        </div>
        <span class="si-badge">${count} reading${count !== 1 ? 's' : ''}</span>
        <span class="chevron">›</span>
      </div>`;
    }).join('');
  },

  newSession() {
    ['ns-event','ns-track','ns-notes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('ns-type').value = 'Practice';
    document.getElementById('ns-num').value = '1';
    this.showView('view-new-session');
  },

  createSession() {
    const event = document.getElementById('ns-event').value.trim();
    const track = document.getElementById('ns-track').value.trim();
    if (!event && !track) { alert('Enter an event name or track name.'); return; }
    const s = {
      id: 'sess_' + Date.now(),
      event, track,
      type: document.getElementById('ns-type').value,
      num: parseInt(document.getElementById('ns-num').value) || 1,
      notes: document.getElementById('ns-notes').value.trim(),
      createdAt: new Date().toISOString()
    };
    DB.addSession(s);
    this.openSession(s.id);
  },

  openSession(id) {
    this.currentSessionId = id;
    const s = DB.getSessions().find(s => s.id === id);
    if (!s) { this.goHome(); return; }
    document.getElementById('sess-title').textContent = s.event || s.track || 'Session';
    document.getElementById('sess-subtitle').textContent = (s.track ? s.track + ' · ' : '') + s.type + ' #' + s.num;
    this.resetForm();
    this.renderTable();
    this.showView('view-session');
  },

  resetForm() {
    ['FL','FR','RL','RR'].forEach(w => {
      document.getElementById('psi-'+w).value = '';
      document.getElementById('tgt-'+w).value = '';
      this.setHC(w, 'cold');
    });
    document.getElementById('reading-notes').value = '';
    document.getElementById('ambient-temp').value = '';
  },

  setHC(wheel, state) {
    this.hcState[wheel] = state;
    document.getElementById('hc-'+wheel+'-cold').classList.toggle('active', state === 'cold');
    document.getElementById('hc-'+wheel+'-hot').classList.toggle('active', state === 'hot');
  },

  logReading() {
    const wheels = ['FL','FR','RL','RR'];
    const batch = {
      id: 'b_' + Date.now(),
      sessionId: this.currentSessionId,
      timestamp: new Date().toISOString(),
      note: document.getElementById('reading-notes').value.trim(),
      ambientTemp: parseFloat(document.getElementById('ambient-temp').value) || null
    };
    let hasAny = false;
    wheels.forEach(w => {
      const v = document.getElementById('psi-'+w).value;
      const psi = parseFloat(v);
      if (!isNaN(psi) && v !== '') {
        batch[w] = {
          psi,
          target: parseFloat(document.getElementById('tgt-'+w).value) || null,
          state: this.hcState[w]
        };
        hasAny = true;
      } else {
        batch[w] = null;
      }
    });
    if (!hasAny) { alert('Enter at least one tire pressure.'); return; }
    DB.addBatch(batch);
    this.resetForm();
    this.renderTable();
    this.toast('✅ Reading logged — ' + new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}));
  },

  renderTable() {
    const batches = DB.getSessionBatches(this.currentSessionId)
      .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp))
      .slice(0, 10);
    const session = DB.getSessions().find(s => s.id === this.currentSessionId);
    const sessLabel = session ? session.type + ' #' + session.num : '';
    const countEl = document.getElementById('sess-entry-count');
    const total = DB.getSessionBatches(this.currentSessionId).length;
    countEl.textContent = total + ' reading' + (total !== 1 ? 's' : '') + (total > 10 ? ' (showing 10)' : '');

    const tbody = document.getElementById('readings-tbody');
    if (!batches.length) {
      tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;padding:20px;color:var(--text-dim)">No readings yet — log one below</td></tr>';
      return;
    }

    tbody.innerHTML = batches.map(b => {
      const time = new Date(b.timestamp).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });

      const cell = (w, state) => {
        const t = b[w];
        if (!t || t.state !== state) return `<td class="td-psi empty">—</td>`;
        return `<td class="td-psi ${state}">${t.psi}</td>`;
      };

      return `<tr>
        <td class="td-time">${time}</td>
        <td class="td-session">${esc(sessLabel)}</td>
        ${cell('FL','cold')}${cell('FL','hot')}
        ${cell('FR','cold')}${cell('FR','hot')}
        ${cell('RL','cold')}${cell('RL','hot')}
        ${cell('RR','cold')}${cell('RR','hot')}
        <td class="td-notes">${esc(b.note || (b.ambientTemp ? b.ambientTemp + '°F' : ''))}</td>
        <td class="td-del"><button class="del-btn" onclick="App.deleteBatch('${b.id}')">×</button></td>
      </tr>`;
    }).join('');
  },

  deleteBatch(id) {
    if (!confirm('Delete this reading?')) return;
    DB.deleteBatch(id);
    this.renderTable();
    this.toast('🗑️ Reading deleted');
  },

  deleteSession() {
    if (!confirm('Delete this session and all readings? Cannot be undone.')) return;
    DB.deleteSession(this.currentSessionId);
    this.goHome();
    this.toast('🗑️ Session deleted');
  },

  exportCSV() {
    const sessions = DB.getSessions();
    const batches = DB.getBatches();
    if (!batches.length) { alert('No data to export yet.'); return; }

    const wheels = ['FL','FR','RL','RR'];
    const headers = ['Timestamp','Event','Track','Session Type','Session #',
      'FL PSI','FL Target','FL State',
      'FR PSI','FR Target','FR State',
      'RL PSI','RL Target','RL State',
      'RR PSI','RR Target','RR State',
      'Ambient Temp (F)','Notes'];
    const rows = [headers.join(',')];
    batches.forEach(b => {
      const s = sessions.find(x => x.id === b.sessionId) || {};
      const time = new Date(b.timestamp).toLocaleString('en-US');
      const cols = [
        `"${time}"`, csvCell(s.event), csvCell(s.track), csvCell(s.type), s.num||''
      ];
      wheels.forEach(w => {
        const t = b[w];
        cols.push(t ? t.psi : '', t && t.target ? t.target : '', t ? t.state : '');
      });
      cols.push(b.ambientTemp || '', csvCell(b.note));
      rows.push(cols.join(','));
    });

    const blob = new Blob([rows.join('\n')], { type:'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `HPDE-Tire-Log-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    this.toast('📤 CSV exported!');
  },

  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }
};

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function csvCell(v) { if (!v) return ''; return '"' + String(v).replace(/"/g,'""') + '"'; }

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
}

App.renderHome();
</script>
</body>
</html>
